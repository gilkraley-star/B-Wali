<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wali — Administration</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{--prune:#5B2C4A;--rose:#E85D75;--corail:#FF8C69;--bg:#FFF8F7;--muted:#6E5C68;--ok:#2E7D55;--bad:#C23B3B;--blue:#15609E;--line:#F3DEE1}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#2E1A28}
  header{background:var(--prune);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;flex:1} header button{background:transparent;color:#fff;border:1px solid #ffffff80;border-radius:999px;padding:6px 12px;cursor:pointer}
  nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
  nav button{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--prune)}
  nav button.on{background:var(--prune);color:#fff;border-color:var(--prune)}
  main{max-width:900px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat b{display:block;font-size:26px;color:var(--prune)} .stat span{font-size:13px;color:var(--muted)}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  textarea{min-height:90px}
  button.p{background:linear-gradient(135deg,var(--rose),var(--corail));color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
  button.s{background:#fff;border:1.5px solid var(--rose);color:var(--rose);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
  button.ok{background:var(--ok);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
  button.bad{background:#fff;color:var(--bad);border:1.5px solid var(--bad);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#FFF0E9;color:var(--prune)}
  .tag.blue{background:#E3F0FA;color:var(--blue)} .tag.red{background:#FBE6E6;color:var(--bad)} .tag.green{background:#E6F4EC;color:var(--ok)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .grow{flex:1}
  pre{white-space:pre-wrap;font:inherit;margin:8px 0;max-height:260px;overflow:auto;background:#FFFAF9;border:1px solid var(--line);border-radius:10px;padding:10px}
  .src a{color:var(--blue)} .src li{margin:3px 0;font-size:13px}
  .avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#eee;flex:none}
  .msg{padding:10px;border-radius:10px;margin:8px 0} .msg.err{background:#FBE6E6;color:var(--bad)} .msg.good{background:#E6F4EC;color:var(--ok)}
  .login{max-width:360px;margin:60px auto}
  small{color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var API = location.origin + "/api";
  var token = sessionStorage.getItem("bw_admin_token") || "";
  var state = { tab: "dash", queue: [], users: [], courses: [], reports: [], reported: [], audit: [], stats: null, msg: null, newPwd: null, selected: {}, filter: "A_VALIDER" };
  var app = document.getElementById("app");

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function safeUrl(u){ return /^https?:\/\//i.test(u) ? u : "#"; }

  async function api(path, opts){
    opts = opts || {};
    var r = await fetch(API + path, {
      method: opts.method || "GET",
      headers: Object.assign({"Content-Type":"application/json"}, token ? {Authorization:"Bearer "+token} : {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    var data = await r.json().catch(function(){ return {}; });
    if (r.status === 401 && token) { logout(); throw new Error("Session expirée."); }
    if (!r.ok) throw new Error(data.error || "Erreur " + r.status);
    return data;
  }
  function logout(){ token = ""; sessionStorage.removeItem("bw_admin_token"); render(); }
  function flash(text, kind){ state.msg = { text: text, kind: kind || "good" }; render(); }

  async function load(){
    try {
      var res = await Promise.all([
        api("/admin/stats"), api("/admin/queue?status=" + state.filter), api("/admin/users"),
        api("/admin/courses"), api("/admin/reports"), api("/admin/audit"), api("/admin/reported-users"), api("/admin/cert-templates"), api("/admin/announcements"), api("/admin/forum-categories"), api("/admin/health-centers"), api("/admin/contents"), api("/admin/forum-posts"), api("/admin/article-categories")
      ]);
      state.stats = res[0]; state.queue = res[1]; state.users = res[2]; state.courses = res[3]; state.reports = res[4]; state.audit = res[5]; state.reported = res[6]; state.tpls = res[7]; state.anns = res[8]; state.fcats = res[9]; state.hcs = res[10]; state.contents = res[11]; state.fposts = res[12]; state.acats = res[13];
    } catch(e){ if (token) flash(e.message, "err"); return; }
    render();
  }

  function loginView(){
    app.innerHTML = '<div class="login card"><div style="text-align:center"><img src="logo.png" alt="Wali" style="height:96px"></div><h2 style="color:var(--prune)">Administration Wali</h2>' +
      '<label>E-mail</label><input id="em" type="email" autocomplete="username">' +
      '<label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password">' +
      '<div id="lmsg"></div><p><button class="p" id="go">Se connecter</button></p>' +
      '<small>Réservé aux comptes administrateurs.</small></div>';
    document.getElementById("go").onclick = async function(){
      try {
        var r = await fetch(API + "/auth/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ email: document.getElementById("em").value.trim(), password: document.getElementById("pw").value }) });
        var d = await r.json();
        if (!r.ok) throw new Error(d.error || "Connexion impossible.");
        if (!d.user || d.user.role !== "ADMIN") throw new Error("Ce compte n'est pas administrateur.");
        token = d.token; sessionStorage.setItem("bw_admin_token", token); load();
      } catch(e){ document.getElementById("lmsg").innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; }
    };
  }

  var TABS = [["dash","Tableau de bord"],["queue","À valider"],["users","Comptes pro"],["content","Contenus"],["courses","Formations"],["forum","Entre Nous"],["hc","Centres de santé"],["certs","Attestations"],["ann","Annonces"],["reports","Signalements"],["audit","Journal"]];

  function render(){
    if (!token) return loginView();
    var pending = state.stats ? state.stats.pending.total : 0;
    var html = '<header><h1><img src="logo.png" alt="" style="height:34px;vertical-align:middle;margin-right:10px">Wali · Administration</h1><button id="out">Se déconnecter</button></header><nav>' +
      TABS.map(function(t){ return '<button data-t="'+t[0]+'" class="'+(state.tab===t[0]?'on':'')+'">'+t[1]+(t[0]==="queue"&&pending?' ('+pending+')':'')+'</button>'; }).join("") + '</nav><main>';
    if (state.msg) html += '<div class="msg '+state.msg.kind+'">'+esc(state.msg.text)+'</div>';
    html += ({dash:dash, queue:queueView, users:usersView, courses:coursesView, forum:forumView, hc:hcView, content:contentView, certs:certsView, ann:annView, reports:reportsView, audit:auditView}[state.tab])();
    html += '</main>';
    app.innerHTML = html;
    document.getElementById("out").onclick = logout;
    Array.prototype.forEach.call(app.querySelectorAll("nav button"), function(b){ b.onclick = function(){ state.tab = b.dataset.t; state.msg = null; state.newPwd = null; render(); }; });
    bind();
  }

  function dash(){
    var s = state.stats; if (!s) return "<p>Chargement…</p>";
    return '<div class="grid">' +
      [["Utilisatrices",s.users],["Professionnelles",s.professionals],["Contenus à valider",s.pending.total],["Fiches publiées",s.published.articles],["Formations publiées",s.published.courses],["Activités revenus publiées",s.published.income],["Inscriptions aux formations",s.enrollments],["Signalements ouverts",s.openReports]]
      .map(function(x){ return '<div class="card stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'; }).join("") + '</div>' +
      '<div class="card"><b>Comment ça marche</b><ol><li><b>Comptes pro</b> : tu crées le compte (avec photo) d\'une sage-femme, d\'un médecin, d\'une psychologue, d\'une coach ou d\'une formatrice.</li><li>Elles se connectent dans l\'application et <b>proposent</b> des fiches, formations ou activités.</li><li>Tout arrive dans <b>À valider</b> : tu lis, tu vérifies les sources, tu approuves ou tu refuses avec un motif.</li><li>Seul ce qui est <b>publié</b> est visible des filles.</li></ol></div>';
  }

  function srcList(sources){
    if (!sources || !sources.length) return '<p class="msg err">Aucune source : impossible de publier tant qu\'une source n\'est pas ajoutée.</p>';
    return '<ul class="src">' + sources.map(function(s){ return '<li>'+esc(s.org)+' — <a href="'+esc(safeUrl(s.url))+'" target="_blank" rel="noopener noreferrer">'+esc(s.title)+'</a></li>'; }).join("") + '</ul>';
  }

  function queueView(){
    var filters = [["A_VALIDER","À valider"],["PUBLIE","Publiés"],["REJETE","Refusés"]];
    var h = '<div class="row" style="margin-bottom:10px">' + filters.map(function(f){ return '<button class="'+(state.filter===f[0]?'p':'s')+'" data-f="'+f[0]+'">'+f[1]+'</button>'; }).join("") + '<span class="grow"></span>' +
      (state.filter==="A_VALIDER" ? '<button class="s" id="selall">Tout sélectionner</button> <button class="ok" id="bulk">Approuver la sélection</button>' : '') + '</div>';
    if (!state.queue.length) return h + '<div class="card">Rien dans cette liste.</div>';
    return h + state.queue.map(function(it){
      var key = it.type + ":" + it.id;
      return '<div class="card"><div class="row">' +
        (state.filter==="A_VALIDER" ? '<input type="checkbox" style="width:auto" data-sel="'+esc(key)+'" '+(state.selected[key]?'checked':'')+'>' : '') +
        '<div class="grow"><b>'+esc(it.title)+'</b><br><small>'+esc(it.category)+(it.author?' · proposé par '+esc(it.author.fullName)+' ('+esc(it.author.profession)+')':' · contenu de départ')+'</small></div>' +
        '<span class="tag '+(it.status==="PUBLIE"?"green":it.status==="REJETE"?"red":"")+'">'+esc(it.status)+'</span></div>' +
        '<details><summary style="cursor:pointer;margin-top:8px">Lire le contenu</summary><pre>'+esc(it.body)+'</pre></details>' +
        (it.reviewNote ? '<p><small>Note : '+esc(it.reviewNote)+'</small></p>' : '') +
        '<b style="font-size:13px">Sources</b>' + srcList(it.sources) +
        '<div class="row">' +
        (it.status!=="PUBLIE" ? '<button class="ok" data-ap="'+esc(key)+'">Approuver et publier</button>' : '<button class="s" data-un="'+esc(key)+'">Retirer de la publication</button>') +
        (it.status==="A_VALIDER" ? '<button class="bad" data-rj="'+esc(key)+'">Refuser…</button>' : '') +
        '</div></div>';
    }).join("");
  }

  function usersView(){
    var h = '<div class="card"><b>Créer un compte professionnel ou partenaire</b>' +
      '<label>Nom complet (ou nom de l’organisation pour un partenaire)</label><input id="u_name" placeholder="Mireille N. · FAFECA">' +
      '<label>E-mail</label><input id="u_mail" type="email">' +
      '<label>Rôle</label><select id="u_role"><option value="PROFESSIONNELLE">Professionnelle de santé (sage-femme, médecin, psychologue…)</option><option value="COACH">Coach</option><option value="FORMATRICE">Formatrice</option><option value="MODERATRICE">Modératrice</option><option value="PARTENAIRE">🤝 Organisation partenaire (propose des formations)</option></select>' +
      '<label>Profession affichée</label><input id="u_prof" placeholder="Sage-femme · Psychologue · Coach en entrepreneuriat…">' +
      '<label>Courte présentation (facultatif)</label><textarea id="u_bio" maxlength="600"></textarea>' +
      '<label>Photo (obligatoire, visage visible) · logo facultatif pour un partenaire</label><input id="u_photo" type="file" accept="image/jpeg,image/png,image/webp"><img id="u_prev" class="avatar" style="margin-top:8px;display:none">' +
      '<label><input id="u_cert" type="checkbox" style="width:auto"> Badge bleu « certifiée » (diplôme vérifié)</label>' +
      '<p><button class="p" id="u_go">Créer le compte</button></p>' +
      (state.newPwd ? '<div class="msg good"><b>Mot de passe provisoire (affiché une seule fois) :</b><br><code style="font-size:18px">'+esc(state.newPwd.pwd)+'</code><br><small>Pour '+esc(state.newPwd.email)+'. Transmets-le en privé : elle devra le changer à la première connexion.</small></div>' : '') +
      '</div>';
    h += state.users.map(function(u){
      return '<div class="card"><div class="row">' +
        (u.photoUrl ? '<img class="avatar" src="'+esc(u.photoUrl)+'" alt="">' : '<div class="avatar"></div>') +
        '<div class="grow"><b>'+esc(u.fullName||u.email)+'</b> '+(u.certified?'<span class="tag blue">✓ certifiée</span>':'')+(u.active?'':' <span class="tag red">désactivé</span>')+'<br><small>'+esc(u.profession||"")+' · '+esc(u.role)+' · '+esc(u.email)+'</small></div></div>' +
        '<div class="row" style="margin-top:8px"><button class="s" data-cert="'+u.id+'" data-v="'+(!u.certified)+'">'+(u.certified?'Retirer le badge':'Donner le badge bleu')+'</button>' +
        '<button class="s" data-act="'+u.id+'" data-v="'+(!u.active)+'">'+(u.active?'Désactiver':'Réactiver')+'</button>' +
        '<button class="s" data-rp="'+u.id+'" data-email="'+esc(u.email)+'">Nouveau mot de passe</button></div></div>';
    }).join("") || '<div class="card">Aucun compte professionnel pour le moment.</div>';
    return h;
  }

  var CT = [["articles","Fiches santé"],["courses","Formations"],["income","Gagner de l’argent"],["stories","Histoires"],["posts","Messages Entre Nous"]];
  function contentView(){
    var t = state.ctype || "articles";
    var h = '<div class="row" style="margin-bottom:10px;flex-wrap:wrap">' + CT.map(function(x){ return '<button class="'+(t===x[0]?'p':'s')+'" data-ct="'+x[0]+'">'+x[1]+'</button>'; }).join("") + '</div>';
    h += '<p><small>Tu gères ici tout ce que les filles voient : <b>Masquer</b> le retire de l’appli sans le perdre, <b>Afficher</b> le remet, <b>Supprimer</b> l’efface pour de bon.</small></p>';
    if (t === "posts") {
      var ps = state.fposts || [];
      return h + (ps.length ? ps.map(function(x){ return '<div class="card"><div class="row"><div class="grow"><b>'+esc(x.title)+'</b> '+(x.hidden?'<span class="tag red">masqué</span>':'')+'<br><small>'+esc(x.theme)+' · '+esc(x.author)+' · '+x.comments+' réponse(s) · '+new Date(x.at).toLocaleDateString("fr-FR")+'</small></div>' +
        '<button class="s" data-pshow="'+x.id+'" data-v="'+(!x.hidden)+'">'+(x.hidden?'Afficher':'Masquer')+'</button><button class="bad" data-pdel="'+x.id+'">Supprimer</button></div><details><summary style="cursor:pointer;margin-top:6px">Lire</summary><pre>'+esc(x.body)+'</pre></details></div>'; }).join("") : '<div class="card">Aucun message.</div>');
    }
    var list = (state.contents || []).filter(function(x){ return x.type === t; });
    if (t === "articles") h += '<div class="card"><b>➕ Nouvelle fiche santé</b><label>Titre</label><input id="n_title"><label>Rubrique</label><select id="n_cat">'+(state.acats||[]).map(function(c){ return '<option value="'+esc(c.slug)+'">'+esc(c.titleFr)+'</option>'; }).join("")+'</select><label>Texte (40 caractères minimum)</label><textarea id="n_body" rows="5"></textarea>' + srcFields() + '<p><button class="p" id="n_go">Publier la fiche</button></p></div>';
    if (t === "income") h += '<div class="card"><b>➕ Nouvelle idée de revenu</b><label>Titre</label><input id="n_title"><label>Capital minimum (FCFA)</label><input id="n_cap" type="number" value="0"><label>Résumé</label><textarea id="n_sum" rows="2"></textarea><label>Il te faut…</label><textarea id="n_needs" rows="3"></textarea><label>Comment démarrer</label><textarea id="n_steps" rows="3"></textarea><label>Risques</label><textarea id="n_risks" rows="2"></textarea>' + srcFields() + '<p><button class="p" id="n_go">Publier</button></p></div>';
    if (t === "stories") h += '<div class="card"><b>➕ Nouvelle histoire</b><label>Titre</label><input id="n_title"><label>Résumé</label><textarea id="n_sum" rows="2"></textarea><label>Type</label><select id="n_scat"><option value="CONTE">Conte</option><option value="HEROINE">Héroïne</option><option value="EDUCATION">Éducation</option><option value="ICI">Histoire d’ici</option><option value="AMOUR">Roman (18+)</option></select><label>Autrice / crédit</label><input id="n_credit" value="Wali"><label>Texte (sépare les chapitres par une ligne contenant ---)</label><textarea id="n_body" rows="8"></textarea><p><button class="p" id="n_go">Publier l’histoire</button></p></div>';
    if (t === "courses") h += '<p><small>Pour créer ou programmer une formation, utilise l’onglet <b>Formations</b>.</small></p>';
    return h + (list.length ? list.map(function(x){
      var hidden = x.status !== "PUBLIE";
      return '<div class="card"><div class="row"><div class="grow"><b>'+esc(x.title)+'</b> <span class="tag '+(x.status==="PUBLIE"?"green":"red")+'">'+(x.status==="PUBLIE"?"visible":x.status==="MASQUE"?"masqué":x.status==="A_VALIDER"?"à valider":"refusé")+'</span><br><small>'+esc(x.category)+'</small></div>' +
        '<button class="s" data-cedit="'+x.type+':'+x.id+'">Modifier</button><button class="s" data-cshow="'+x.type+':'+x.id+'" data-v="'+(hidden?"PUBLIE":"MASQUE")+'">'+(hidden?'Afficher':'Masquer')+'</button><button class="bad" data-cdel="'+x.type+':'+x.id+'">Supprimer</button></div></div>'; }).join("") : '<div class="card">Rien ici pour le moment.</div>');
  }
  function srcFields(){ return '<label>Source (obligatoire pour la santé et les revenus)</label><input id="n_stitle" placeholder="Titre du document, ex. Guide OMS sur…"><div class="row"><input id="n_sorg" placeholder="Organisme (OMS, UNICEF…)"><input id="n_surl" placeholder="https://…"></div>'; }
  function srcVal(){ function g(i){ return document.getElementById(i).value.trim(); } return [{ title: g("n_stitle"), org: g("n_sorg"), url: g("n_surl") }]; }

  function hcView(){
    var l = state.hcs || [];
    var h = '<p><small>Les centres que voient les filles dans « Centres de santé ». Pour la position : ouvre Google Maps, appuie longuement sur le lieu, copie les deux nombres (ex. 4.37237, 18.57470) et colle-les ci-dessous. Le bouton « Itinéraire » de l’appli ouvre alors la carte sur ce point.</small></p>' +
      '<div class="card"><b>➕ Ajouter un centre</b>' +
      '<label>Nom</label><input id="h_name" placeholder="Hôpital de l’Amitié">' +
      '<label>Type (facultatif)</label><input id="h_kind" placeholder="Hôpital public · gynécologie">' +
      '<div class="row"><div class="grow"><label>Ville</label><input id="h_city" value="Bangui"></div><div class="grow"><label>Quartier (facultatif)</label><input id="h_dist"></div></div>' +
      '<label>Position (latitude, longitude)</label><input id="h_pos" placeholder="4.37237, 18.57470">' +
      '<label>Téléphone (facultatif, vérifié)</label><input id="h_tel" placeholder="+236 …">' +
      '<p><button class="p" id="h_go">Ajouter le centre</button></p></div>';
    l.forEach(function(c){
      h += '<div class="card"><div class="row"><div class="grow"><b>'+esc(c.name)+'</b> '+(c.active?'':'<span class="tag">masqué</span>')+'<br><small>'+esc(c.kind||'')+' · '+esc(c.city||'')+(c.district?' ('+esc(c.district)+')':'')+'<br>'+(c.lat!=null?'📍 '+c.lat+', '+c.lng:'<span style="color:#C23B3B">⚠️ pas de position : l’itinéraire cherchera par le nom</span>')+(c.phone?' · 📞 '+esc(c.phone):'')+'</small></div>' +
        '<button class="s" data-hcedit="'+c.id+'">Modifier</button><button class="s" data-hcact="'+c.id+'" data-v="'+(!c.active)+'">'+(c.active?'Masquer':'Afficher')+'</button><button class="bad" data-hcdel="'+c.id+'">Supprimer</button></div></div>';
    });
    return h || '<div class="card">Aucun centre.</div>';
  }
  function parsePos(t){ var m = /(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)/.exec(t||""); return m ? { lat: parseFloat(m[1].replace(",", ".")), lng: parseFloat(m[2].replace(",", ".")) } : null; }

  function forumView(){
    var cats = state.fcats || [];
    var parents = cats.filter(function(c){ return !c.parentId; });
    var h = '<p><small>Les thèmes que voient les filles dans « Entre Nous ». Un thème général a une icône et contient des sous-thèmes où elles écrivent. Un thème qui contient déjà des messages ne peut pas être supprimé (renomme-le).</small></p>' +
      '<div class="card"><b>➕ Nouveau thème général</b><div class="row"><input id="fc_icon" placeholder="🙏" style="max-width:70px"><input class="grow" id="fc_title" placeholder="Ex. Religion et foi"><button class="p" id="fc_add">Ajouter</button></div></div>';
    parents.forEach(function(p){
      h += '<div class="card"><div class="row"><span style="font-size:22px">'+esc(p.icon||"💬")+'</span><b class="grow">'+esc(p.titleFr)+'</b><button class="s" data-fren="'+p.id+'">Renommer</button><button class="bad" data-frdel="'+p.id+'">Supprimer</button></div>';
      cats.filter(function(c){ return c.parentId === p.id; }).forEach(function(c){ h += '<div class="row" style="margin:6px 0 0 26px"><span class="grow">'+esc(c.titleFr)+' <small>('+c.posts+' msg)</small></span><button class="s" data-fren="'+c.id+'">Renommer</button><button class="bad" data-frdel="'+c.id+'">Supprimer</button></div>'; });
      h += '<div class="row" style="margin:10px 0 0 26px"><input class="grow" data-subin="'+p.id+'" placeholder="Nouveau sous-thème…"><button class="p" data-subadd="'+p.id+'">Ajouter</button></div></div>';
    });
    return h;

  // --- redimensionne la photo avant envoi (max 640 px, JPEG) ---
  function fileToDataUrl(file, maxSide, mime){
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onerror = function(){ reject(new Error("Lecture de la photo impossible.")); };
      fr.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("Image illisible.")); };
        img.onload = function(){
          var max = maxSide || 640, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
          var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL(mime || "image/jpeg", 0.88));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
